<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나나샵 셀러 관리자</title>
<style>
  :root{
    --bg:#f2f5f4; --panel:#fff; --line:#dde5e2; --line2:#eef3f1;
    --ink:#17251f; --ink2:#54655d; --ink3:#8a9993;
    --brand:#0f7a63; --brand-d:#0a5c4a; --brand-l:#e6f4f0;
    --ok:#1f7a4d; --warn:#b4690e; --danger:#c0392b; --info:#1f5fbf;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  .hidden{display:none !important}

  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px 34px}
  .login-logo{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
  .login-logo span{color:var(--brand)}
  .login-sub{color:var(--ink3);font-size:13px;margin:0 0 26px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--brand)}
  .err{color:var(--danger);font-size:13px;margin:-4px 0 12px;min-height:18px}
  .login-hint{margin-top:22px;padding:12px 14px;background:#fffbe9;border:1px solid #f0e2b6;border-radius:var(--radius);font-size:12.5px;color:#6b5a1f;line-height:1.7}
  .login-hint b{color:#4a3d10}

  .btn{padding:9px 15px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink)}
  .btn:hover{background:#f6faf8}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-danger{background:#fff;border-color:#e2b7b1;color:var(--danger)}
  .btn-block{display:block;width:100%;padding:11px 16px}
  .btn-sm{padding:5px 10px;font-size:12.5px}

  .topbar{background:var(--brand);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
  .topbar-logo{font-size:16px;font-weight:700;letter-spacing:-.4px}
  .topbar-right{display:flex;align-items:center;gap:12px;font-size:13px}
  .topbar-right button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:5px 10px;font-size:12.5px}
  .topbar-right button:hover{background:rgba(255,255,255,.26)}
  #appView{min-height:100vh;display:flex;flex-direction:column}
  .shell{flex:1;display:flex}
  .side{flex:0 0 186px;background:#fff;border-right:1px solid var(--line);padding:16px 0}
  .side-sec{padding:8px 20px 6px;font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.4px}
  .side a{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;color:var(--ink2);font-size:13.5px;border-left:3px solid transparent}
  .side a:hover{background:#f5f9f8;color:var(--ink)}
  .side a.on{background:var(--brand-l);color:var(--brand-d);border-left-color:var(--brand);font-weight:600}
  .side .badge{background:var(--danger);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700}
  .main{flex:1;padding:24px 28px;min-width:0}
  .page-head{margin:0 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .page-head h1{font-size:20px;margin:0 0 5px;letter-spacing:-.3px}
  .page-head p{margin:0;color:var(--ink3);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line2)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
  th{background:#f5f9f8;color:var(--ink2);font-weight:600;font-size:12.5px;white-space:nowrap;border-top:1px solid var(--line)}
  tbody tr:hover{background:#fafcfb}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.low td{background:#fff8f7}
  tr.low:hover td{background:#fdf1ef}

  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .tag-ok{background:#e7f4ed;color:var(--ok)}
  .tag-warn{background:#fdf3e3;color:var(--warn)}
  .tag-wait{background:#eef1f6;color:var(--ink2)}
  .tag-new{background:#fdecea;color:var(--danger)}
  .tag-info{background:#eaf1fc;color:var(--info)}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .l{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
  .stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px}
  .stat .v small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:3px}

  .pager{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .pager button{min-width:32px;padding:6px 9px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:13px;color:var(--ink2)}
  .pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .pager button:disabled{color:#c3c9d4;cursor:default}
  .pager .info{margin-left:10px;font-size:12.5px;color:var(--ink3)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;font-family:inherit}

  .stars{color:#e8a33d;letter-spacing:1px}
  .review{padding:15px 2px;border-bottom:1px solid var(--line2)}
  .review:last-child{border-bottom:none}
  .rv-top{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
  .rv-body{margin:0 0 9px;line-height:1.75}
  .rv-reply{background:#f5f9f8;border-left:3px solid var(--brand);padding:10px 13px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.7;margin-top:8px}
  .rv-reply .who{color:var(--brand-d);font-weight:600;font-size:12.5px;display:block;margin-bottom:3px}
  .rv-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .rv-actions textarea{flex:1;min-width:220px;min-height:60px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;font-size:13.5px;resize:vertical}

  .inq{padding:15px 2px;border-bottom:1px solid var(--line2)}
  .inq:last-child{border-bottom:none}
  .inq-top{display:flex;gap:9px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
  .inq-q{margin:0 0 9px;line-height:1.75}
  .inq-a{background:#f5f9f8;border-left:3px solid var(--brand);padding:10px 13px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.7}
  .inq-a .who{color:var(--brand-d);font-weight:600;font-size:12.5px;display:block;margin-bottom:3px}

  .form-row{display:flex;gap:14px;margin-bottom:13px;align-items:flex-start}
  .form-row label{flex:0 0 100px;padding-top:9px;font-size:13.5px;color:var(--ink2)}
  .form-row .fc{flex:1}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;font-family:inherit}
  .form-row textarea{min-height:110px;resize:vertical;line-height:1.7}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
  .preview{background:#fbfdfc;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
  .preview h3{text-align:center;font-size:17px;margin:0 0 18px;letter-spacing:2px}
  .mail-head{font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:14px}
  .mail-head b{color:var(--ink);display:inline-block;min-width:52px}
  .mail-body{white-space:pre-wrap;line-height:1.85;font-size:13.5px}

  .empty{padding:34px 0;text-align:center;color:var(--ink3);font-size:13.5px}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#17251f;color:#fff;padding:12px 20px;border-radius:6px;font-size:13.5px;box-shadow:0 4px 18px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;z-index:60}
  .toast.show{opacity:1;bottom:44px}
  .foot{padding:16px 28px;color:var(--ink3);font-size:12px;border-top:1px solid var(--line);background:#fff}
  .hl{background:#fffbe6;transition:background 1.6s}
  @media (max-width:860px){
    .shell{flex-direction:column}
    .side{flex:none;width:100%;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;padding:6px}
    .side-sec{display:none}
    .side a{border-left:none;border-bottom:2px solid transparent;padding:9px 13px;gap:6px}
    .side a.on{border-left:none;border-bottom-color:var(--brand)}
    .main{padding:18px 16px}
    .form-row{flex-direction:column;gap:6px}
    .form-row label{flex:none;padding-top:0}
  }
</style>
</head>

var PER = 10;
function viewOrders(){

                         .reduce(function(a,o){ return a+o.amount; },0);
  var rows = ORDERS.filter(function(o){
    if(st.ordDate==='today' && o.day!==today) return false;
    if(st.ordFilter!=='all' && o.state!==st.ordFilter) return false;
    return true;
  });
  var pages = Math.max(1, Math.ceil(rows.length/PER));
  if(st.ordPage>pages) st.ordPage=pages;
  var page = rows.slice((st.ordPage-1)*PER, st.ordPage*PER);

  var h='<div class="page-head"><div><h1>주문 관리</h1><p>'+ymdhm(NOW)+' 기준</p></div></div>';

  h+='<div class="stat"><div class="l">오늘 매출 (취소 제외)</div><div class="v" style="font-size:20px">'+won(todaySales)+'<small>원</small></div></div>';
  h+='<div class="stat"><div class="l">오늘 취소</div><div class="v">'+todays.filter(function(o){return o.state==='취소';}).length+'<small>건</small></div></div>';
  h+='<div class="stat"><div class="l">전체 주문</div><div class="v">'+ORDERS.length+'<small>건</small></div></div>';
  h+='</div>';

  h+='<div class="card">';
  h+='<div class="filters"><label>기간</label><select id="fDate">'+
     '<option value="all"'+(st.ordDate==='all'?' selected':'')+'>전체</option>'+
     '<option value="today"'+(st.ordDate==='today'?' selected':'')+'>오늘</option></select>';
  h+='<label>상태</label><select id="fState">';
  ['all','결제완료','상품준비중','배송중','배송완료','취소','교환요청','반품요청'].forEach(function(s){
    h+='<option value="'+s+'"'+(st.ordFilter===s?' selected':'')+'>'+(s==='all'?'전체':s)+'</option>'; });
  h+='</select><span style="color:var(--ink3);font-size:12.5px">조회 결과 '+rows.length+'건</span></div>';

  h+='<table id="orderTable"><thead><tr><th>주문번호</th><th>주문일시</th><th>주문자</th><th>상품코드</th><th>상품명</th><th>수량</th><th>결제금액</th><th>상태</th></tr></thead><tbody>';
  if(!page.length) h+='<tr><td colspan="8"><div class="empty">조회 결과가 없습니다.</div></td></tr>';
  page.forEach(function(o){
    var cls = o.state==='취소' ? 'tag tag-wait' : (o.state==='배송완료' ? 'tag tag-ok'
             : (o.state==='교환요청'||o.state==='반품요청' ? 'tag tag-new' : 'tag tag-info'));
    h+='<tr><td>'+o.no+'</td><td>'+o.at+'</td><td>'+esc(o.cust)+'</td><td>'+o.sku+'</td>'+
       '<td>'+esc(o.name)+'</td><td class="num">'+o.qty+'</td><td class="num">'+won(o.amount)+'</td>'+
       '<td><span class="'+cls+'">'+o.state+'</span></td></tr>';
  });
  h+='</tbody></table>';
  h+=pagerHtml(st.ordPage, rows.length);

  return h;
}
function pagerHtml(page, total){
  var pages=Math.max(1,Math.ceil(total/PER)), h='<div class="pager">';
  h+='<button data-pg="'+(page-1)+'" '+(page===1?'disabled':'')+'>이전</button>';
  for(var i=1;i<=pages;i++) h+='<button data-pg="'+i+'" class="'+(i===page?'on':'')+'">'+i+'</button>';
  h+='<button data-pg="'+(page+1)+'" '+(page===pages?'disabled':'')+'>다음</button>';
  h+='<span class="info">전체 '+total+'건 중 '+(total?((page-1)*PER+1):0)+'–'+Math.min(page*PER,total)+'건</span>';
  return h+'</div>';
}

  low.forEach(function(p){
    var v=null; VENDORS.forEach(function(x){ if(x.id===p.vendor) v=x; });
    var suggest=(p.safe-p.stock)+20;
    h+='<tr><td>'+p.sku+'</td><td>'+esc(p.name)+'</td><td class="num">'+p.stock+'</td>'+
       '<td class="num">'+p.safe+'</td><td>'+esc(v.name)+'</td>'+
       '<td class="num"><input type="number" min="0" value="'+suggest+'" data-po="'+p.sku+'" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;text-align:right;font-family:inherit"></td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="form-actions"><button class="btn btn-primary" id="btnPoPreview">발주서 미리보기</button></div></div>';
  return h;
}
function buildPoMails(){
  var byVendor={};
  document.querySelectorAll('input[data-po]').forEach(function(inp){
    var qty=parseInt(inp.value,10)||0; if(qty<=0) return;
    var sku=inp.getAttribute('data-po'), p=null; PRODUCTS.forEach(function(x){ if(x.sku===sku) p=x; });
    if(!byVendor[p.vendor]) byVendor[p.vendor]=[];
    byVendor[p.vendor].push({p:p, qty:qty});
  });
  var mails=[];
  Object.keys(byVendor).forEach(function(vid){
    var v=null; VENDORS.forEach(function(x){ if(x.id===vid) v=x; });
    var items=byVendor[vid], total=0, lines=[];
    items.forEach(function(it, i){
      var amt=it.p.price*it.qty; total+=amt;
      lines.push((i+1)+'. '+it.p.name+' ('+it.p.sku+')  수량 '+it.qty+'개  단가 '+won(it.p.price)+'원  금액 '+won(amt)+'원');
    });
    mails.push({
      to: v.name+' '+v.manager+' 담당자님 <'+v.email+'>',
      subject: '[나나샵] 발주 요청 - '+ymd(NOW),
      body: v.name+' '+v.manager+'님, 안녕하세요.\n나나샵 온라인사업팀 정유진입니다.\n\n아래와 같이 발주 요청드립니다.\n\n'
            + lines.join('\n')
            + '\n\n합계 금액: '+won(total)+'원\n납기 조건: '+v.term
            + '\n입고처: 나나샵 물류센터\n\n확인 후 회신 부탁드립니다.\n감사합니다.\n\n나나샵 온라인사업팀 정유진 드림'
    });
  });
  return mails;
}

/* ---------- 고객 문의 ---------- */
function viewInq(){
  var list=getInq();
  var un=list.filter(function(i){return i.state==='미답변';}).length;
  var h='<div class="page-head"><div><h1>고객 문의</h1><p>전체 '+list.length+'건 · 미답변 '+un+'건</p></div>'+
        '<button class="btn" id="btnNewInq">새 문의 1건 받기</button></div><div class="card">';
  if(!list.length) return h+'<div class="empty">문의가 없습니다.</div></div>';
  list.forEach(function(q){
    h+='<div class="inq" data-inq="'+q.id+'">';
    h+='<div class="inq-top"><span class="tag tag-info">'+esc(q.type)+'</span>'+
       '<b>'+esc(q.cust)+'</b><span style="color:var(--ink3);font-size:12.5px">'+q.at+'</span>'+
       (q.state==='미답변'?'<span class="tag tag-new">미답변</span>':'<span class="tag tag-ok">답변완료</span>')+'</div>';
    h+='<p class="inq-q">'+esc(q.q)+'</p>';
    if(q.answer){
      h+='<div class="inq-a"><span class="who">나나샵 답변</span>'+esc(q.answer)+'</div>';
    }else{
      h+='<div class="rv-actions"><textarea data-ans="'+q.id+'" placeholder="답변을 입력하세요"></textarea>'+
         '<button class="btn btn-primary btn-sm" data-send-ans="'+q.id+'">답변 발송</button></div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

/* ---------- 리뷰 ---------- */
function stars(n){ return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n); }
function viewReviews(){
  var rep=getReplies();
  var noReply=REVIEWS.filter(function(r){ return !rep[r.id]; }).length;
  var avg=(REVIEWS.reduce(function(a,r){return a+r.star;},0)/REVIEWS.length).toFixed(2);
  var h='<div class="page-head"><div><h1>리뷰</h1><p>전체 '+REVIEWS.length+'건 · 미답변 '+noReply+'건 · 평균 '+avg+'점</p></div></div>';
  h+='<div class="summary">';
  [5,4,3,2,1].forEach(function(s){
    h+='<div class="stat"><div class="l">'+s+'점</div><div class="v">'+
       REVIEWS.filter(function(r){return r.star===s;}).length+'<small>건</small></div></div>';
  });
  h+='</div><div class="card">';
  REVIEWS.forEach(function(r){
    var p=null; PRODUCTS.forEach(function(x){ if(x.sku===r.sku) p=x; });
    h+='<div class="review" data-rv="'+r.id+'">';
    h+='<div class="rv-top"><span class="stars">'+stars(r.star)+'</span>'+
       '<b>'+esc(r.c)+'</b><span style="color:var(--ink3);font-size:12.5px">'+esc(p.name)+' · '+ymd(addDays(NOW,-r.day))+'</span></div>';
    h+='<p class="rv-body">'+esc(r.body)+'</p>';
    if(rep[r.id]){
      h+='<div class="rv-reply"><span class="who">판매자 답글</span>'+esc(rep[r.id])+'</div>';
    }else{
      h+='<div class="rv-actions"><textarea data-rvans="'+r.id+'" placeholder="답글을 입력하세요"></textarea>'+
         '<button class="btn btn-primary btn-sm" data-send-rv="'+r.id+'">답글 등록</button></div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

/* ---------- 보낸함 ---------- */
function viewSent(){
  var s=getSent();
  var h='<div class="page-head"><div><h1>보낸함</h1><p>발송·등록 이력 '+s.length+'건</p></div></div><div class="card">';
  if(!s.length) return h+'<div class="empty">아직 보낸 내역이 없습니다.</div></div>';
  h+='<table><thead><tr><th>일시</th><th>종류</th><th>대상</th><th>내용</th></tr></thead><tbody>';
  s.forEach(function(x){
    h+='<tr><td style="white-space:nowrap">'+x.at+'</td><td><span class="tag tag-info">'+esc(x.kind)+'</span></td>'+
       '<td>'+esc(x.to)+'</td><td style="max-width:520px">'+esc(x.summary)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------- 이벤트 ---------- */
function bind(top){
  document.querySelectorAll('.pager button[data-pg]').forEach(function(b){
    b.addEventListener('click',function(){ st.ordPage=+b.getAttribute('data-pg'); route(); }); });
  var fd=document.getElementById('fDate'); if(fd) fd.addEventListener('change',function(){ st.ordDate=fd.value; st.ordPage=1; route(); });
  var fs=document.getElementById('fState'); if(fs) fs.addEventListener('change',function(){ st.ordFilter=fs.value; st.ordPage=1; route(); });

  var bp=document.getElementById('btnPoPreview');
  if(bp) bp.addEventListener('click',function(){
    var mails=buildPoMails();
    if(!mails.length){ toast('발주 수량을 입력해 주세요.'); return; }
    st.poPreview={mails:mails}; route();
  });
  var bb=document.getElementById('btnPoBack'); if(bb) bb.addEventListener('click',function(){ st.poPreview=null; route(); });
  var bs=document.getElementById('btnPoSend');
  if(bs) bs.addEventListener('click',function(){
    st.poPreview.mails.forEach(function(m){
      pushSent({ at: ymdhm(new Date()), kind:'발주 메일', to:m.to, summary:m.subject });
    });
    var n=st.poPreview.mails.length; st.poPreview=null;
    location.hash='#/sent'; toast(n+'개 거래처로 발주 메일을 보냈습니다.');
  });

  var bn=document.getElementById('btnNewInq');
  if(bn) bn.addEventListener('click',function(){
    var list=getInq(), cur=Store.get('inqCursor',0);
    var src=INQ_QUEUE[cur % INQ_QUEUE.length];
    var maxId=0; list.forEach(function(x){ if(x.id>maxId) maxId=x.id; });
    list.unshift({ id:maxId+1, type:src.t, cust:src.c, q:src.q, at: ymdhm(new Date()), state:'미답변', answer:null });
    Store.set('inq', list); Store.set('inqCursor', cur+1);
    route();
    var el=document.querySelector('[data-inq="'+(maxId+1)+'"]');
    if(el){ el.classList.add('hl'); setTimeout(function(){ el.classList.remove('hl'); }, 1800); }
    toast('새 문의가 1건 도착했습니다.');
  });
  document.querySelectorAll('[data-send-ans]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=+b.getAttribute('data-send-ans');
      var ta=document.querySelector('[data-ans="'+id+'"]');
      var txt=(ta.value||'').trim();
      if(!txt){ toast('답변 내용을 입력해 주세요.'); return; }
      var list=getInq(), target=null;
      list.forEach(function(x){ if(x.id===id){ x.answer=txt; x.state='답변완료'; target=x; } });
      Store.set('inq', list);
      pushSent({ at: ymdhm(new Date()), kind:'문의 답변', to: target.cust+' 고객님', summary: txt });
      route(); toast('답변을 발송했습니다.');
    });
  });
  document.querySelectorAll('[data-send-rv]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=+b.getAttribute('data-send-rv');
      var ta=document.querySelector('[data-rvans="'+id+'"]');
      var txt=(ta.value||'').trim();
      if(!txt){ toast('답글 내용을 입력해 주세요.'); return; }
      var rep=getReplies(); rep[id]=txt; Store.set('replies', rep);
      var r=null; REVIEWS.forEach(function(x){ if(x.id===id) r=x; });
      pushSent({ at: ymdhm(new Date()), kind:'리뷰 답글', to: r.c+' 고객님 ('+r.star+'점)', summary: txt });
      route(); toast('답글을 등록했습니다.');
    });
  });
}

(function init(){ if(Store.get('session',null)) enterApp(); else show('loginView'); })();
</script>
